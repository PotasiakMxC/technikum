<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zadanie 24-Java script</title>
</head>
<body>
    <button onclick="show()">Pokaż galerię</button>
    <div id="galeria"></div>
    <img id="podglad">
    <script>
        function show(){
            let zdjecia = ["1.jpg","2.jpg","3.jpg","4.jpg",];
            let galeria = document.getElementById("galeria");
            galeria.innerHTML = "";

            for(let i = 0; i < zdjecia.length; i++){
                let obraz = document.createElement("img");
                obraz.src = zdjecia[i];
                obraz.width = 150;
                obraz.alt = "zdjecie " + (i+1);
                obraz.onclick = function(){
                    document.getElementById("podglad").src = obraz.src;
                }
                galeria.appendChild(obraz);
            }
        }
    </script>
</body>
</html>
