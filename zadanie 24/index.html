<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zadanie 24-Java script</title>
</head>
<body>
    <input type="text" id="produkt">
    <button onclick="Dodaj()">Dodaj</button>
    <ul id="lista"></ul>
    <p id="licznik"></p>

    <div id="test">
        <p>tak</p>
        <p>nie</p>
        <p>chuj</p>
    </div>
    <script>
        function Dodaj(){
            let pole = document.getElementById("produkt");
            let tekst = pole.value.trim();
            if(tekst == ""){
                return;
            }
            let lista = document.getElementById("lista");
            let element = document.createElement("li");
            element.textContent = pole.value;
            lista.appendChild(element);
            pole.value = "";
            document.getElementById("licznik").innerHTML = "liczniba produktów " + lista.children.length;
            
            console.log(document.getElementById("test").children);
        }
    </script>
</body>
</html>
